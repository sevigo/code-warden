# config.demo.yaml — Code-Warden demo / quickstart configuration
#
# This config is designed for local demo and on-prem evaluation.
# All secrets are read from environment variables (see .env.example).
# Viper maps env vars automatically: SECTION_KEY → section.key
#
# Used by:
#   make quickstart           — Full server stack via Docker
#   docker-compose.demo.yml   — Mounts this file as /app/config.yaml

server:
  port: "8080"
  max_workers: 3

github:
  # Secrets come from env vars: GITHUB_APP_ID, GITHUB_WEBHOOK_SECRET,
  # GITHUB_PRIVATE_KEY_PATH, GITHUB_TOKEN
  private_key_path: "keys/code-warden-app.private-key.pem"

ai:
  # Provider: "ollama" — routes to Ollama cloud for generation
  # Override via AI_LLM_PROVIDER env var.
  llm_provider: "ollama"

  # Ollama endpoint — overridden to http://ollama:11434 inside docker-compose
  ollama_host: "http://localhost:11434"

  # Generator: Ollama cloud model — runs on Ollama's infrastructure, no GPU needed.
  # No large model download; Ollama routes the request to the cloud.
  # Override via AI_GENERATOR_MODEL env var.
  # Alternatives: qwen3.5:35b, glm-5.1, minimax-m2.7, deepseek-v3.2
  generator_model: "kimi-k2.5"

  # Thinking/reasoning mode — off by default; enable for models that support it
  # (kimi-k2.5 and qwen3.5 both support thinking mode)
  enable_thinking: false

  model_keep_alive: "10m"
  enable_code_suggestions: true

storage:
  repo_path: "./data/repos"

database:
  # Host overridden to "db" inside docker-compose via DATABASE_HOST env var
  host: "localhost"
  port: 5432
  database: "codewarden"
  username: "warden"
  # Password comes from DATABASE_PASSWORD env var
  password: "secret"
  ssl_mode: "disable"
  conn_max_lifetime: "5m"
  conn_max_idle_time: "5m"

logging:
  level: "info"
  format: "text"
  output: "stdout"

# Agent (autonomous /implement command) — disabled by default in demo mode.
# To enable: set agent.enabled: true and configure a GitHub App + ngrok tunnel.
#
# mode: "pi" uses the native Go agent loop with file manipulation tools
# (read_file, write_file, edit_file, list_dir) in addition to the MCP code
# navigation tools. No external binary required.
agent:
  enabled: false
  mode: "pi"
  model: "kimi-k2.5"          # Ollama cloud model — same as generator, no extra download
  max_iterations: 5
  max_concurrent_sessions: 3
  timeout: "1h"
  mcp_addr: "127.0.0.1:8081"
  working_dir: "./data/agent-workspaces"
  # Per-phase iteration budgets (warden mode). Omit or set to 0 to use built-in defaults.
  # plan_iterations: 8      # Planning loop (read-only exploration before editing)
  # edit_iterations: 50     # Edit/implement loop (main coding budget)
  # review_rounds: 10       # Max orchestrator-driven review+fix cycles
  # fix_iterations: 8       # Fix loop iterations per review round
  # publish_iterations: 8   # Publish loop (push branch + open PR)
